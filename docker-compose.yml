version: "3.9"

services:
  php:
    image: php:8.3-fpm
    container_name: startpage-php
    working_dir: /var/www/html
    volumes:
      - ./public:/var/www/html

  nginx:
    image: nginx:latest
    container_name: startpage-nginx
    ports:
      - "8080:80"
    volumes:
      - ./public:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
